name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            docker pull ghcr.io/${{ github.repository }}:latest
            docker rm -f telecommunicator || true
            docker run -d --name telecommunicator --restart unless-stopped \
              -p 8000:8000 \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              -e SERVER_ADDRESS="${{ secrets.SERVER_ADDRESS }}" \
              -e DATABASE_URL="sqlite+aiosqlite:////data/messenger.db" \
              -v td_data:/data \
              -v td_uploads:/app/uploads \
              ghcr.io/${{ github.repository }}:latest
